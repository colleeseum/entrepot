<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Ferme Colle : Storage | Entreposage">
    <meta name="description" content="">
    <meta name="recaptcha-site-key" content="6LdtriMsAAAAAPdpmajQiMtE18YxQHECy4UIgcCx">
    <title></title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
    <link rel="manifest" href="/static/site.webmanifest">
    <link rel="stylesheet" href="/static/site.css">
    <!-- Metadata and structured data are generated by scripts/build-site.mjs. -->
  </head>

  <body>
    <div class="table">
      <header class="header">
        <div class="left"></div>
        <div class="center header__inner">
          <div>
            <p class="eyebrow">Alfred • Ontario</p>
            <p class="domaine">Ferme Colle</p>
          </div>
          <nav class="nav">
            <a href="#seasons" data-i18n="nav.seasons"></a>
            <a href="#facility" data-i18n="nav.facility"></a>
            <a href="#contract" data-i18n="nav.contract"></a>
            <a href="#contact" data-i18n="nav.contact"></a>
          </nav>
          <div class="language-toggle" role="group" aria-label="Language selector" data-i18n="header.languageLabel" data-i18n-attr="aria-label">
            <a href="/en/" hreflang="en" lang="en" class="language-toggle__btn active" data-lang-toggle="en">
              EN
            </a>
            <a href="/fr/" hreflang="fr" lang="fr" class="language-toggle__btn" data-lang-toggle="fr">
              FR
            </a>
          </div>
        </div>
        <div class="right"></div>
      </header>

      <main class="body">
        <div class="left"></div>
        <div class="center main">
          <section class="hero">
            <div class="hero__content">
              <p class="eyebrow" data-i18n="hero.eyebrow"></p>
              <h1 data-i18n="hero.title"></h1>
              <p data-i18n="hero.description"></p>
              <div class="hero__cta">
                <a class="button button--primary" href="#contract" data-i18n="hero.ctaReserve"></a>
                <a class="button button--ghost" href="tel:514-627-5377" data-i18n="hero.ctaCall"></a>
              </div>
            </div>
            <figure class="hero__media">
              <img src="/static/images/exterior.jpg" alt="" data-i18n="image.exterior" data-i18n-fallback-key="hero.caption" data-i18n-attr="alt" loading="lazy">
              <figcaption data-i18n="hero.caption"></figcaption>
            </figure>
          </section>

          <section id="facility" class="section facility">
            <header>
              <p class="eyebrow" data-i18n="facility.eyebrow"></p>
              <h2 data-i18n="facility.heading"></h2>
              <p data-i18n="facility.description"></p>
            </header>
            <div class="facility__grid">
              <article>
                <img src="/static/images/interior-full.jpg" alt="" data-i18n="image.interior" data-i18n-fallback-key="hero.caption" data-i18n-attr="alt" loading="lazy">
                <h3 data-i18n="facility.indoor.title"></h3>
                <p data-i18n="facility.indoor.body"></p>
              </article>
              <article>
                <img src="/static/images/outside.jpg" alt="" data-i18n="image.outdoor" data-i18n-fallback-key="hero.caption" data-i18n-attr="alt" loading="lazy">
                <h3 data-i18n="facility.outdoor.title"></h3>
                <p data-i18n="facility.outdoor.body"></p>
              </article>
              <article>
                <div class="facility__list">
                  <ul>
                    <li data-i18n="facility.details.deposits"></li>
                    <li data-i18n="facility.details.battery"></li>
                    <li data-i18n="facility.details.appointments"></li>
                    <li data-i18n="facility.details.payments"></li>
                    <li data-i18n="facility.details.insurance"></li>
                  </ul>
                </div>
              </article>
            </div>
          </section>

          <section id="seasons" class="section">
            <header>
              <p class="eyebrow" data-i18n="seasonSection.eyebrow"></p>
              <h2 data-i18n="seasonSection.heading"></h2>
            </header>
            <div class="season-grid" id="season-grid"></div>
          </section>

          <section class="section services">
            <header>
              <p class="eyebrow" data-i18n="services.eyebrow"></p>
              <h2 data-i18n="services.heading"></h2>
              <p data-i18n="services.description"></p>
            </header>
            <div class="services__grid">
              <article>
                <h3 data-i18n="services.battery.title"></h3>
                <p data-i18n-html="true" data-i18n="services.battery.body"></p>
              </article>
              <article>
                <h3 data-i18n="services.propane.title"></h3>
                <p data-i18n-html="true" data-i18n="services.propane.body"></p>
              </article>
            </div>
          </section>

          <section class="section" id="arrival" data-content-requires="access.heading,access.body,access.nojs">
            <h2 data-i18n="access.heading"></h2>
            <p data-i18n="access.body"></p>
            <noscript><p data-i18n="access.nojs"></p></noscript>
          </section>

          <section id="contract" class="section contract">
            <header>
              <p class="eyebrow" data-i18n="contractSection.eyebrow"></p>
              <h2 data-i18n="contractSection.heading"></h2>
              <p data-i18n-html="true" data-i18n="contractHelper.intro"></p>
              <p class="contract-helper-card__reader-note" data-i18n-html="true" data-i18n="contractHelper.readerNote"></p>
            </header>
            <div class="contract__grid">
              <article class="contract-helper-card">
                <form id="contract-helper">
                  <div class="form-steps-nav">
                    <button type="button" data-step-target="1" class="active" data-i18n="form.steps.tenant"></button>
                    <button type="button" data-step-target="2" data-i18n="form.steps.vehicle"></button>
                    <button type="button" data-step-target="3" data-i18n="form.steps.insurance"></button>
                    <button type="button" data-step-target="4" data-i18n="form.steps.review"></button>
                  </div>
                  <div class="form-step active" data-step="1">
                    <label>
                      <span data-i18n="form.season.label"></span>
                      <select name="season" required>
                        <option value="" selected disabled data-i18n="form.selectPrompt"></option>
                      </select>
                    </label>
                    <div class="form-row form-row--two form-row--name-phone">
                      <label class="grid-2">
                        <span data-i18n="form.fullName.label"></span>
                        <input type="text" name="tenantName" autocomplete="section-tenant name" required>
                      </label>
                      <label class="grid-2">
                        <span data-i18n="form.phone.label"></span>
                        <input type="tel" name="tenantPhone" autocomplete="section-tenant tel" required>
                      </label>
                    </div>
                    <div class="form-row form-row--address-email">
                      <label class="grid-2">
                        <span data-i18n="form.address.label"></span>
                        <input type="text" name="tenantAddress" autocomplete="section-tenant street-address" required>
                      </label>
                      <label class="grid-2">
                        <span data-i18n="form.email.label"></span>
                        <input type="email" name="email" autocomplete="section-tenant email" required>
                      </label>
                    </div>
                    <div class="form-row form-row--city-block">
                      <label class="grid-2">
                        <span data-i18n="form.city.label"></span>
                        <input type="text" name="tenantCity" autocomplete="section-tenant address-level2" required>
                      </label>
                      <label class="grid-2 postal-field">
                        <span data-i18n="form.postal.label"></span>
                        <input type="text" name="tenantPostal" autocomplete="section-tenant postal-code" placeholder="A1A 1A1" required>
                      </label>
                      <label class="grid-2 province-field">
                        <span data-i18n="form.province.label"></span>
                        <select name="tenantProvince" autocomplete="section-tenant address-level1" required>
                          <option value="" selected disabled>
                            --
                          </option>
                          <option value="ON">ON</option>
                          <option value="QC">QC</option>
                        </select>
                      </label>
                    </div>
                  </div>
                  <div class="form-step" data-step="2">
                    <label class="form-field--full">
                      <span data-i18n="form.storageLocation.label"></span>
                      <select name="storageLocation" required>
                        <option value="indoor" selected data-i18n="form.storageLocation.indoor"></option>
                        <option value="outdoor" data-i18n="form.storageLocation.outdoor"></option>
                      </select>
                    </label>
                    <div class="vehicle-type-row">
                      <label class="vehicle-type-row__select">
                        <span data-i18n="form.vehicleType.label"></span>
                        <select name="vehicleType" id="vehicle-type-select" required>
                          <option value="" selected disabled data-i18n="form.selectPrompt"></option>
                        </select>
                      </label>
                      <button type="button" class="button button--ghost button--sm contract-reset vehicle-type-row__reset" data-reset-vehicle="" data-i18n="form.resetVehicle"></button>
                    </div>
                    <label id="vehicle-type-other" class="hidden">
                      <span data-i18n="form.vehicleType.other"></span>
                      <input type="text" name="vehicleTypeOther">
                    </label>
                    <div class="form-row form-row--vehicle">
                      <label class="grid-2">
                        <span data-i18n="form.brand.label"></span>
                        <input type="text" name="vehicleBrand">
                      </label>
                      <label class="grid-2">
                        <span data-i18n="form.model.label"></span>
                        <input type="text" name="vehicleModel">
                      </label>
                    </div>
                    <div class="form-row form-row--vehicle form-row--vehicle-triple">
                      <label class="grid-2">
                        <span data-i18n="form.colour.label"></span>
                        <input type="text" name="vehicleColour">
                      </label>
                      <label class="grid-2">
                        <span class="form-label-with-help">
                          <span data-i18n="form.length.label"></span>
                          <button type="button" class="form-label-help" aria-describedby="length-help-text" aria-label="Length details" data-i18n="form.length.helpLabel" data-i18n-attr="aria-label">
                            ?
                          </button>
                          <span id="length-help-text" class="form-label-help-text" data-i18n="form.length.helpText"></span>
                        </span>
                        <input type="number" name="vehicleLength" min="5" max="60" class="input--compact">
                      </label>
                      <label class="grid-2 vehicle-year">
                        <span data-i18n="form.year.label"></span>
                        <input type="number" name="vehicleYear" min="1950" max="2050" value="2020" required inputmode="numeric">
                      </label>
                    </div>
                    <div class="form-row form-row--vehicle">
                      <label class="grid-2">
                        <span data-i18n="form.plate.label"></span>
                        <input type="text" name="vehiclePlate" placeholder="ABC123">
                      </label>
                      <label class="grid-2">
                        <span data-i18n="form.vehicleProvince.label"></span>
                        <select name="vehicleProv" required>
                          <option value="" selected disabled data-i18n="form.selectPrompt"></option>
                          <option value="ON">Ontario (ON)</option>
                          <option value="QC">Québec (QC)</option>
                        </select>
                      </label>
                    </div>
                  </div>
                  <div class="form-step" data-step="3">
                    <label class="form-field--full">
                      <span data-i18n="form.insuranceCompany.label"></span>
                      <input type="text" name="insuranceCompany">
                    </label>
                    <div class="form-row form-row--two">
                      <label>
                      <span data-i18n="form.policyNumber.label"></span>
                      <input type="text" name="insurancePolicy">
                    </label>
                      <label>
                      <span data-i18n="form.expiration.label"></span>
                      <input type="date" name="insuranceExpiration">
                    </label>
                      <p class="form-warning" data-insurance-warning="" data-i18n="form.expiration.warning" hidden></p>
                    </div>
                    <div class="form-divider" aria-hidden="true"></div>
                    <p class="form-addons-title" data-i18n="form.addons.title"></p>
                    <label class="checkbox checkbox--with-price">
                      <input type="checkbox" name="battery" value="yes">
                      <span class="checkbox__text" data-i18n="form.service.battery"></span>
                      <span class="checkbox__price hidden" data-addon-price="battery"></span>
                    </label>
                    <label class="checkbox checkbox--with-price">
                      <input type="checkbox" name="propane" value="yes">
                      <span class="checkbox__text" data-i18n="form.service.propane"></span>
                      <span class="checkbox__price hidden" data-addon-price="propane"></span>
                    </label>
                  </div>
                  <div class="form-step" data-step="4">
                    <label class="form-field--full">
                      <span data-i18n="form.deposit.label"></span>
                      <input type="number" name="deposit" min="50" step="50" value="100" readonly>
                    </label>
                    <label class="form-field--full">
                      <span data-i18n="form.leaseDuration.label"></span>
                      <input type="text" name="leaseDuration" readonly placeholder="Completed by Ferme Colle" data-i18n="form.completedPlaceholder" data-i18n-attr="placeholder">
                    </label>
                    <label class="form-field--full">
                      <span data-i18n="form.leaseCost.label"></span>
                      <input type="text" name="leaseCost" readonly placeholder="Completed by Ferme Colle" data-i18n="form.completedPlaceholder" data-i18n-attr="placeholder">
                    </label>
                    <div class="request-queue">
                      <div class="request-queue__header">
                        <span data-i18n="form.queue.title"></span>
                        <span class="request-queue__count" data-request-count=""></span>
                      </div>
                      <p class="request-queue__empty" data-request-empty="" data-i18n="form.queue.empty"></p>
                      <ul class="request-queue__list" data-request-vehicle-list=""></ul>
                      <div class="request-queue__actions">
                        <button type="button" class="button button--ghost" data-add-vehicle="" data-i18n="form.queue.add"></button>
                        <button type="button" class="button button--ghost hidden" data-request-reset="" data-i18n="form.queue.reset"></button>
                      </div>
                    </div>
                    <div class="captcha-field" role="group" aria-labelledby="request-captcha-label">
                      <span id="request-captcha-label" data-i18n="form.captcha.label"></span>
                      <div class="captcha-field__widget" data-request-recaptcha-container=""></div>
                      <small class="captcha-field__hint" data-i18n="form.captcha.hint"></small>
                    </div>
                    <div class="form-row form-row--full">
                      <button class="button button--primary" type="submit" data-i18n="form.preview"></button>
                    </div>
                    <p class="contract__hint" data-i18n-html="true" data-i18n="form.previewHint"></p>
                    <p class="form-status" data-contract-status="" hidden></p>
                  </div>
                  <div class="form-step-controls">
                    <button type="button" class="button button--ghost" data-step-prev="" data-i18n="form.back"></button>
                  <button type="button" class="button button--primary" data-step-next="" data-i18n="form.next"></button>
                </div>
                </form>
              </article>
            </div>
          </section>

          <section id="contact" class="section contact">
            <header>
              <p class="eyebrow" data-i18n="contactSection.eyebrow"></p>
              <h2 data-i18n="contactSection.heading"></h2>
            </header>
            <div class="contact__grid">
              <article>
                <h3 data-i18n="contactSection.talkTitle"></h3>
                <p data-i18n-html="true" data-i18n="contactSection.talkBodyPrimary"></p>
                <p data-i18n="contactSection.talkBodySecondary"></p>
              </article>
              <article>
                <h3 data-i18n="contactSection.formTitle"></h3>
                <form id="contact-form">
                  <label>
                    <span data-i18n="contactForm.name.label"></span>
                    <input type="text" name="name" autocomplete="section-contact name" required>
                  </label>
                  <label>
                    <span data-i18n="contactForm.email.label"></span>
                    <input type="email" name="email" autocomplete="section-contact email" required>
                  </label>
                  <label>
                    <span data-i18n="contactForm.season.label"></span>
                    <select name="season" data-contact-season-select="" required>
                      <option value="" data-i18n="form.selectPrompt"></option>
                    </select>
                  </label>
                  <label>
                    <span data-i18n="contactForm.vehicle.label"></span>
                    <select name="vehicle" data-contact-vehicle-select="" required>
                      <option value="" data-i18n="form.selectPrompt"></option>
                    </select>
                  </label>
                  <label>
                    <span data-i18n="contactForm.message.label"></span>
                    <textarea name="message" rows="4" required placeholder="Tell us what you need stored & your ideal drop-off date" data-i18n="contactForm.message.placeholder" data-i18n-attr="placeholder"></textarea>
                  </label>
                  <div class="file-upload">
                    <div class="file-upload__header">
                      <span data-i18n="contactForm.upload.label"></span>
                      <button type="button" class="button button--ghost button--xs" data-attachment-trigger="" data-i18n="contactForm.upload.button"></button>
                    </div>
                    <p class="file-upload__hint" data-i18n="contactForm.upload.hint"></p>
                    <input type="file" id="contact-attachments" name="attachments" accept=".pdf,.png,.jpg,.jpeg,.webp,.heic,.heif,.gif" multiple hidden>
                    <ul class="file-upload__list" data-attachment-list="" hidden></ul>
                  </div>
                  <div class="captcha-field" role="group" aria-labelledby="contact-captcha-label">
                    <span id="contact-captcha-label" data-i18n="contactForm.captcha.label"></span>
                    <div class="captcha-field__widget" data-recaptcha-container=""></div>
                    <p class="captcha-field__hint" data-i18n="contactForm.captcha.hint"></p>
                  </div>
                  <button type="submit" class="button button--ghost" data-i18n="contactForm.submit"></button>
                  <p class="form-status" data-contact-status="" hidden></p>
                </form>
                <p class="contract__hint" data-i18n="contactForm.hint"></p>
              </article>
            </div>
          </section>
        </div>
        <div class="right"></div>
  </main>

  <footer class="footer">
        <div class="left"></div>
        <div class="center footer__inner">
          <div>
            <span class="container_title" data-i18n="footer.address"></span>
            <p>
              Conc 4<br>
              Alfred, Ontario<br>
              K0B 1A0
            </p>
          </div>
          <div>
            <span class="container_title" data-i18n="footer.bookings"></span>
            <p>
              <a href="tel:514-627-5377">514-627-5377</a><br>
              <a href="mailto:storage@as-colle.com" data-contact-email="">
                storage@as-colle.com</a>
            </p>
          </div>
          <div>
            <span class="container_title" data-i18n="footer.office"></span>
            <p>Ferme Colle • 276 rue Dolbec, Suite 200, St-Eustache, QC J7R 6N5</p>
          </div>
        </div>
        <div class="right"></div>
      </footer>
    </div>

    <script src="/static/site.js" type="module"></script>
  </body>
</html>
