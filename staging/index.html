<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Ferme Colle Staging</title>
  </head>
  <body>
    <script type="module">
      const load = async () => {
        const res = await fetch("/index.html", { cache: "no-store" });
        if (!res.ok) {
          document.body.textContent = "Failed to load site shell.";
          return;
        }
        const html = await res.text();
        const parsed = new DOMParser().parseFromString(html, "text/html");

        // Copy the production <head>, but rewrite asset URLs before inserting them.
        // This avoids the browser attempting to load /staging/static/... resources.
        document.head.replaceChildren();

        // Ensure relative asset URLs resolve from site root, not /staging.
        const base = document.createElement("base");
        base.href = "/";
        document.head.appendChild(base);

        const absolutizeUrl = (value) => {
          if (!value) return value;
          if (value.startsWith("http://") || value.startsWith("https://")) return value;
          if (value.startsWith("/")) return value;
          if (value.startsWith("./")) return `/${value.slice(2)}`;
          if (value.startsWith("static/")) return `/${value}`;
          return value;
        };

        Array.from(parsed.head.childNodes).forEach((node) => {
          if (node.nodeType !== Node.ELEMENT_NODE) {
            document.head.appendChild(node.cloneNode(true));
            return;
          }
          const el = node.cloneNode(true);
          const tag = el.tagName;
          if (tag === "BASE") {
            return;
          }
          if (tag === "LINK") {
            const href = el.getAttribute("href");
            if (href) el.setAttribute("href", absolutizeUrl(href));
          }
          if (tag === "SCRIPT") {
            const src = el.getAttribute("src");
            if (src) el.setAttribute("src", absolutizeUrl(src));
          }
          document.head.appendChild(el);
        });
        // Add a noindex tag even if missing upstream.
        const robots = document.createElement("meta");
        robots.name = "robots";
        robots.content = "noindex, nofollow";
        document.head.appendChild(robots);

        document.body.innerHTML = parsed.body.innerHTML;
        document.title = "Ferme Colle Staging";

        // Prevent double-loading the site script (the copied production body includes it).
        document.querySelectorAll('script[src]').forEach((script) => {
          const src = script.getAttribute("src") || "";
          if (src.endsWith("/static/site.js") || src.endsWith("./static/site.js") || src === "./static/site.js") {
            script.remove();
          }
        });

        // Cache-bust during local iteration so changes are picked up after hard reloads.
        const cacheBust = Date.now();
        await import(`/static/site.js?v=${cacheBust}`);
      };

      load().catch((err) => {
        console.error(err);
        document.body.textContent = "Failed to load staging preview.";
      });
    </script>
  </body>
</html>
